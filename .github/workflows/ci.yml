name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: devcloud_test
          POSTGRES_PASSWORD: devcloud_test
          POSTGRES_DB: devcloud_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devcloud_test -d devcloud_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+asyncpg://devcloud_test:devcloud_test@localhost:5432/devcloud_test

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run test suite
        run: python -m pytest -q
