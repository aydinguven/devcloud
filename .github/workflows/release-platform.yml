name: Release platform bundles

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional GitHub release tag; defaults to platform-vVERSION-SHORT_SHA
        required: false
        type: string
      publish_quay:
        description: Push versioned controller and worker images to Quay
        required: true
        default: true
        type: boolean
      sign_release:
        description: Sign release.json with the configured GPG release key
        required: true
        default: false
        type: boolean
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: devcloud-platform-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Rocky 10 platform
    runs-on: [self-hosted, linux, x64, rocky10, devcloud-release]
    timeout-minutes: 240
    environment: release
    env:
      QUAY_REGISTRY: quay.io
      QUAY_REPOSITORY: aaslangoren/devcloud
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
      RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
      RELEASE_GPG_KEY_ID: ${{ secrets.RELEASE_GPG_KEY_ID }}
      PUBLISH_QUAY: ${{ github.event_name == 'push' || inputs.publish_quay }}
      SIGN_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_release }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve immutable release metadata
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Manual releases must be dispatched from main." >&2
            exit 1
          fi

          version="$(python3 -c 'from app import __version__; print(__version__)')"
          short_sha="${GITHUB_SHA:0:12}"

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            release_tag="${GITHUB_REF_NAME}"
            if [[ "${release_tag}" != "v${version}" ]]; then
              echo "Tag ${release_tag} does not match app version v${version}." >&2
              exit 1
            fi
          else
            release_tag="${{ inputs.release_tag }}"
            release_tag="${release_tag:-platform-v${version}-${short_sha}}"
          fi

          if [[ ! "${release_tag}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "Release tag contains unsupported characters: ${release_tag}" >&2
            exit 1
          fi

          asset_dir="${RUNNER_TEMP}/devcloud-release-assets"
          rm -rf -- "${asset_dir}"
          install -d -m 0755 "${asset_dir}"

          platform_filename="devcloud-platform-update-v${version}-${short_sha}.tar.gz"
          asset_base_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${release_tag}"

          {
            echo "DEVCLOUD_VERSION=${version}"
            echo "SHORT_SHA=${short_sha}"
            echo "RELEASE_TAG=${release_tag}"
            echo "ASSET_DIR=${asset_dir}"
            echo "PLATFORM_FILENAME=${platform_filename}"
            echo "ASSET_BASE_URL=${asset_base_url}"
          } >> "${GITHUB_ENV}"

      - name: Verify Rocky 10 release runner
        shell: bash
        run: |
          set -Eeuo pipefail
          source /etc/os-release
          [[ "${ID}" == "rocky" && "${VERSION_ID%%.*}" == "10" ]] || {
            echo "Release runner must be Rocky Linux 10; found ${ID} ${VERSION_ID}." >&2
            exit 1
          }

          for command in git python3 podman dnf createrepo_c gh; do
            command -v "${command}" >/dev/null 2>&1 || {
              echo "Release runner is missing ${command}." >&2
              exit 1
            }
          done

          dnf download --help >/dev/null
          podman info >/dev/null
          git diff --exit-code
          git diff --cached --exit-code

      - name: Install Python test environment
        shell: bash
        run: |
          set -Eeuo pipefail
          release_venv="${RUNNER_TEMP}/devcloud-release-venv"
          rm -rf -- "${release_venv}"
          python3 -m venv "${release_venv}"
          "${release_venv}/bin/python" -m pip install --disable-pip-version-check --upgrade pip
          "${release_venv}/bin/python" -m pip install --disable-pip-version-check -r requirements.txt
          echo "${release_venv}/bin" >> "${GITHUB_PATH}"

      - name: Run complete test suite
        run: python -m pytest -q

      - name: Import release signing key
        if: env.SIGN_RELEASE == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -n "${RELEASE_GPG_PRIVATE_KEY}" ]] || {
            echo "sign_release requires RELEASE_GPG_PRIVATE_KEY." >&2
            exit 1
          }

          printf '%s' "${RELEASE_GPG_PRIVATE_KEY}" | gpg --batch --import
          signing_key="${RELEASE_GPG_KEY_ID}"
          if [[ -z "${signing_key}" ]]; then
            signing_key="$(
              gpg --batch --with-colons --list-secret-keys |
                awk -F: '$1 == "fpr" { print $10; exit }'
            )"
          fi
          [[ -n "${signing_key}" ]] || {
            echo "No imported GPG signing key was found." >&2
            exit 1
          }

          gpg --batch --yes --output "${ASSET_DIR}/devcloud-release-keyring.gpg" --export "${signing_key}"
          echo "SIGNING_KEY=${signing_key}" >> "${GITHUB_ENV}"

      - name: Build controller and worker images
        shell: bash
        run: |
          set -Eeuo pipefail
          bash deploy/container/build-controller-image.sh
          bash deploy/container/build-worker-image.sh

          if ! podman image exists localhost/devcloud-postgresql:16; then
            podman pull quay.io/sclorg/postgresql-16-c10s:latest
            podman tag quay.io/sclorg/postgresql-16-c10s:latest localhost/devcloud-postgresql:16
          fi

      - name: Publish immutable Quay image tags
        if: env.PUBLISH_QUAY == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -n "${QUAY_USERNAME}" && -n "${QUAY_PASSWORD}" ]] || {
            echo "Quay publishing requires QUAY_USERNAME and QUAY_PASSWORD." >&2
            exit 1
          }

          printf '%s' "${QUAY_PASSWORD}" |
            podman login --username "${QUAY_USERNAME}" --password-stdin "${QUAY_REGISTRY}"

          for role in controller worker; do
            local_image="localhost/devcloud-${role}:${DEVCLOUD_VERSION}"
            for remote_tag in "${role}-${DEVCLOUD_VERSION}" "${role}-${DEVCLOUD_VERSION}-${SHORT_SHA}"; do
              remote_image="${QUAY_REGISTRY}/${QUAY_REPOSITORY}:${remote_tag}"
              podman tag "${local_image}" "${remote_image}"
              podman push "${remote_image}"
            done
          done

      - name: Build platform update and Git release channel
        shell: bash
        run: |
          set -Eeuo pipefail
          signing_arguments=()
          if [[ -n "${SIGNING_KEY:-}" ]]; then
            signing_arguments=(--signing-key "${SIGNING_KEY}")
          fi

          build_arguments=(
            --output-dir "${ASSET_DIR}"
            --controller-source "${QUAY_REGISTRY}/${QUAY_REPOSITORY}:controller-${DEVCLOUD_VERSION}-${SHORT_SHA}"
            --worker-source "${QUAY_REGISTRY}/${QUAY_REPOSITORY}:worker-${DEVCLOUD_VERSION}-${SHORT_SHA}"
            --channel-output "${ASSET_DIR}/devcloud-update-channel.json"
            --channel-url "${ASSET_BASE_URL}/${PLATFORM_FILENAME}"
          )
          python deploy/build_platform_update.py "${build_arguments[@]}" "${signing_arguments[@]}"

      - name: Build server and worker offline bundles
        shell: bash
        run: |
          set -Eeuo pipefail
          python deploy/package_offline.py --bundle-role server --output-dir "${ASSET_DIR}" --skip-image-build

          python deploy/package_offline.py --bundle-role worker --output-dir "${ASSET_DIR}" --skip-image-build

      - name: Verify generated release assets
        shell: bash
        run: |
          set -Eeuo pipefail

          python - "${ASSET_DIR}/${PLATFORM_FILENAME}" <<'PY'
          import os
          import sys
          from pathlib import Path

          from app.installer.platform import CommandRunner
          from app.installer.release import prepare_release
          from app.platform_release import load_platform_release

          bundle = Path(sys.argv[1])
          signing_key = os.environ.get("SIGNING_KEY", "")
          keyring = Path(os.environ["ASSET_DIR"]) / "devcloud-release-keyring.gpg"
          with prepare_release(
              bundle,
              runner=CommandRunner(),
              keyring=keyring,
              require_signature=bool(signing_key),
          ) as prepared:
              release = load_platform_release(prepared.root)
              assert release.version == os.environ["DEVCLOUD_VERSION"]
              assert release.source_commit == os.environ["GITHUB_SHA"]
          PY

          for role in server worker; do
            if [[ "${role}" == "server" ]]; then
              pattern='devcloud-offline-v*.tar.gz'
            else
              pattern='devcloud-worker-offline-v*.tar.gz'
            fi
            bundle="$(find "${ASSET_DIR}" -maxdepth 1 -type f -name "${pattern}" -print -quit)"
            [[ -n "${bundle}" ]] || {
              echo "Missing ${role} offline bundle." >&2
              exit 1
            }
            verify_root="${RUNNER_TEMP}/verify-${role}"
            rm -rf -- "${verify_root}"
            install -d -m 0755 "${verify_root}"
            tar -xf "${bundle}" -C "${verify_root}"
            extracted="$(find "${verify_root}" -mindepth 1 -maxdepth 1 -type d -print -quit)"
            python deploy/package_offline.py --verify "${extracted}" --expected-role "${role}" --check-runtime
          done

          find "${ASSET_DIR}" -maxdepth 1 -type f -print0 |
            sort -z |
            xargs -0 sha256sum

      - name: Create or update GitHub Release
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -d '' release_assets < <(
            find "${ASSET_DIR}" -maxdepth 1 -type f -print0 | sort -z
          )
          [[ "${#release_assets[@]}" -gt 0 ]] || {
            echo "No release assets were generated." >&2
            exit 1
          }

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" --clobber "${release_assets[@]}"
          else
            gh release create "${RELEASE_TAG}" "${release_assets[@]}" --target "${GITHUB_SHA}" --title "DevCloud ${DEVCLOUD_VERSION} (${SHORT_SHA})" --generate-notes
          fi

      - name: Advance stable Git update channel
        shell: bash
        run: |
          set -Eeuo pipefail
          channel_copy="${RUNNER_TEMP}/devcloud-update-channel.json"
          cp "${ASSET_DIR}/devcloud-update-channel.json" "${channel_copy}"

          git config user.name github-actions
          git config user.email github-actions@github.com

          if git ls-remote --exit-code --heads origin stable >/dev/null 2>&1; then
            git fetch --depth=1 origin stable
            git switch --force-create stable FETCH_HEAD
          else
            git switch --orphan stable
          fi

          git rm -r --ignore-unmatch .
          cp "${channel_copy}" devcloud-update-channel.json
          git add devcloud-update-channel.json

          if git diff --cached --quiet; then
            echo "Stable channel already references this release."
            exit 0
          fi

          git commit -m "release: point stable to ${DEVCLOUD_VERSION}-${SHORT_SHA}"
          git push origin HEAD:stable

      - name: Log out of Quay
        if: always()
        shell: bash
        run: podman logout "${QUAY_REGISTRY}" >/dev/null 2>&1 || true
