name: Release platform bundles

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional GitHub release tag; defaults to platform-vVERSION-SHORT_SHA
        required: false
        type: string
      publish_quay:
        description: Push versioned runtime images and all changed workspace images to Quay
        required: true
        default: true
        type: boolean
      rebuild_jupyter:
        description: Force a Jupyter workspace image rebuild even when its build context is unchanged
        required: true
        default: false
        type: boolean
      sign_release:
        description: Sign release.json with the configured GPG release key
        required: true
        default: false
        type: boolean
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: devcloud-platform-release
  cancel-in-progress: false

jobs:
  release_scope:
    name: Resolve release build scope
    runs-on: ubuntu-24.04
    outputs:
      build_workspace: ${{ steps.scope.outputs.build_workspace }}
      workspace_matrix: ${{ steps.scope.outputs.workspace_matrix }}
    env:
      FORCE_JUPYTER_REBUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.rebuild_jupyter }}
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed workspace image contexts
        id: scope
        shell: bash
        run: |
          set -Eeuo pipefail
          tag_base="${GITHUB_SHA}"
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]] && git rev-parse --verify "${GITHUB_SHA}^" >/dev/null 2>&1; then
            tag_base="${GITHUB_SHA}^"
          fi
          mapfile -t previous_tags < <(
            git tag --merged "${tag_base}" --sort=-version:refname --list 'v*.*.*'
          )
          previous_tag="${previous_tags[0]:-}"

          workspace_images=()
          for image in vscode-empty vscode-python vscode-react vscode-java jupyter-python; do
            if [[ "${image}" == "jupyter-python" && "${FORCE_JUPYTER_REBUILD}" == "true" ]]; then
              workspace_images+=("${image}")
              continue
            fi
            if [[ -z "${previous_tag}" ]] || ! git diff --quiet "${previous_tag}" "${GITHUB_SHA}" -- "containers/${image}"; then
              workspace_images+=("${image}")
            fi
          done

          matrix_json="$(printf '%s\n' "${workspace_images[@]}" | python3 -c 'import json, sys; print(json.dumps([line.strip() for line in sys.stdin if line.strip()]))')"
          echo "workspace_matrix=${matrix_json}" >> "${GITHUB_OUTPUT}"
          if ((${#workspace_images[@]})); then
            echo "build_workspace=true" >> "${GITHUB_OUTPUT}"
            echo "Workspace images selected: ${workspace_images[*]}"
          else
            echo "build_workspace=false" >> "${GITHUB_OUTPUT}"
            echo "No workspace image build contexts changed since ${previous_tag}."
          fi

  workspace_images:
    name: Build and publish ${{ matrix.image }} workspace
    needs: release_scope
    if: needs.release_scope.outputs.build_workspace == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: release
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.release_scope.outputs.workspace_matrix) }}
    env:
      QUAY_REGISTRY: quay.io
      QUAY_REPOSITORY: aaslangoren/devcloud
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
      PUBLISH_QUAY: ${{ github.event_name == 'push' || inputs.publish_quay }}

    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Validate release version
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Manual releases must be dispatched from main." >&2
            exit 1
          fi
          version="$(python3 -c 'from app import __version__; print(__version__)')"
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match app version v${version}." >&2
            exit 1
          fi
          echo "DEVCLOUD_VERSION=${version}" >> "${GITHUB_ENV}"
          echo "SHORT_SHA=${GITHUB_SHA:0:12}" >> "${GITHUB_ENV}"

      - name: Build workspace image
        shell: bash
        run: |
          set -Eeuo pipefail
          image="${{ matrix.image }}"
          local_image="localhost/devcloud-${image}:${DEVCLOUD_VERSION}"
          docker build --pull --platform linux/amd64 \
            --file "containers/${image}/Containerfile" \
            --tag "${local_image}" \
            "containers/${image}"

      - name: Push immutable workspace image tags
        if: env.PUBLISH_QUAY == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -n "${QUAY_USERNAME:-}" && -n "${QUAY_PASSWORD:-}" ]] || {
            echo "Quay publishing requires QUAY_USERNAME and QUAY_PASSWORD." >&2
            exit 1
          }
          printf '%s' "${QUAY_PASSWORD}" |
            docker login --username "${QUAY_USERNAME}" --password-stdin "${QUAY_REGISTRY}"
          trap 'docker logout "${QUAY_REGISTRY}" >/dev/null 2>&1 || true' EXIT
          image="${{ matrix.image }}"
          local_image="localhost/devcloud-${image}:${DEVCLOUD_VERSION}"
          for remote_tag in \
            "${image}-${DEVCLOUD_VERSION}" \
            "${image}-${DEVCLOUD_VERSION}-${SHORT_SHA}"; do
            remote_image="${QUAY_REGISTRY}/${QUAY_REPOSITORY}:${remote_tag}"
            docker tag "${local_image}" "${remote_image}"
            docker push "${remote_image}"
          done

  release:
    name: Build and publish Rocky 10 platform
    needs: [release_scope, workspace_images]
    if: >-
      always() &&
      needs.release_scope.result == 'success' &&
      (needs.workspace_images.result == 'success' || needs.workspace_images.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    environment: release
    env:
      QUAY_REGISTRY: quay.io
      QUAY_REPOSITORY: aaslangoren/devcloud
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
      RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
      RELEASE_GPG_KEY_ID: ${{ secrets.RELEASE_GPG_KEY_ID }}
      PUBLISH_QUAY: ${{ github.event_name == 'push' || inputs.publish_quay }}
      # Signing stays opt-in while existing hosts transition to trusted keyrings.
      SIGN_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_release }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve immutable release metadata
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Manual releases must be dispatched from main." >&2
            exit 1
          fi

          version="$(python3 -c 'from app import __version__; print(__version__)')"
          short_sha="${GITHUB_SHA:0:12}"

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            release_tag="${GITHUB_REF_NAME}"
            if [[ "${release_tag}" != "v${version}" ]]; then
              echo "Tag ${release_tag} does not match app version v${version}." >&2
              exit 1
            fi
          else
            release_tag="${{ inputs.release_tag }}"
            release_tag="${release_tag:-platform-v${version}-${short_sha}}"
          fi

          if [[ ! "${release_tag}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "Release tag contains unsupported characters: ${release_tag}" >&2
            exit 1
          fi

          asset_dir="${RUNNER_TEMP}/devcloud-release-assets"
          rm -rf -- "${asset_dir}"
          install -d -m 0755 "${asset_dir}"

          platform_filename="devcloud-platform-update-v${version}-${short_sha}.tar.gz"
          asset_base_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${release_tag}"

          {
            echo "DEVCLOUD_VERSION=${version}"
            echo "SHORT_SHA=${short_sha}"
            echo "RELEASE_TAG=${release_tag}"
            echo "ASSET_DIR=${asset_dir}"
            echo "PLATFORM_FILENAME=${platform_filename}"
            echo "ASSET_BASE_URL=${asset_base_url}"
          } >> "${GITHUB_ENV}"

      - name: Check hosted runner capacity
        shell: bash
        run: |
          set -Eeuo pipefail
          docker info >/dev/null
          available_kib="$(df --output=avail -k "${RUNNER_TEMP}" | tail -n 1 | tr -d ' ')"
          if (( available_kib < 8388608 )); then
            echo "At least 8 GiB of free runner storage is required; found $((available_kib / 1024 / 1024)) GiB." >&2
            exit 1
          fi
          df -h "${RUNNER_TEMP}"

      - name: Build and verify in Rocky Linux 10
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --privileged --rm \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --volume "${ASSET_DIR}:/release-assets" \
            --env GITHUB_SHA \
            --env DEVCLOUD_VERSION \
            --env SHORT_SHA \
            --env PLATFORM_FILENAME \
            --env ASSET_BASE_URL \
            --env QUAY_REGISTRY \
            --env QUAY_REPOSITORY \
            --env QUAY_USERNAME \
            --env QUAY_PASSWORD \
            --env PUBLISH_QUAY \
            --env SIGN_RELEASE \
            --env RELEASE_GPG_PRIVATE_KEY \
            --env RELEASE_GPG_KEY_ID \
            rockylinux/rockylinux:10.2 \
            bash /workspace/deploy/ci/build-release-assets.sh

      - name: Create or update GitHub Release
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -d '' release_assets < <(
            find "${ASSET_DIR}" -maxdepth 1 -type f -print0 | sort -z
          )
          [[ "${#release_assets[@]}" -gt 0 ]] || {
            echo "No release assets were generated." >&2
            exit 1
          }

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" --clobber "${release_assets[@]}"
          else
            gh release create "${RELEASE_TAG}" "${release_assets[@]}" --target "${GITHUB_SHA}" --title "DevCloud ${DEVCLOUD_VERSION} (${SHORT_SHA})" --generate-notes
          fi

      - name: Advance stable Git update channel
        shell: bash
        run: |
          set -Eeuo pipefail
          channel_copy="${RUNNER_TEMP}/devcloud-update-channel.json"
          cp "${ASSET_DIR}/devcloud-update-channel.json" "${channel_copy}"

          git config user.name github-actions
          git config user.email github-actions@github.com

          if git ls-remote --exit-code --heads origin stable >/dev/null 2>&1; then
            git fetch --depth=1 origin stable
            git switch --force-create stable FETCH_HEAD
          else
            git switch --orphan stable
          fi

          git rm -r --ignore-unmatch .
          cp "${channel_copy}" devcloud-update-channel.json
          git add devcloud-update-channel.json

          if git diff --cached --quiet; then
            echo "Stable channel already references this release."
            exit 0
          fi

          git commit -m "release: point stable to ${DEVCLOUD_VERSION}-${SHORT_SHA}"
          git push origin HEAD:stable
